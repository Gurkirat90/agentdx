name: CI

# The CI spine. Every job here calls a `just` recipe and nothing else, so what CI runs and
# what a developer runs are the same command by construction. All of it passes on an empty
# tree — the gates exist before the code they gate, which is the only order in which an
# architectural rule survives (CONTEXT.md §5 row 1).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required project-wide; `agentdx doctor` checks it (AGENTS.md §4.1).
  PYTHONHASHSEED: "0"

jobs:
  python:
    name: python (${{ matrix.os }})
    # NFR-12: macOS Apple silicon is the primary target, Linux is the Docker target.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check-ledger diffs §8/§9 against the base; a shallow clone has no base to diff.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync environment
        run: just sync

      # 1. ruff check + ruff format --check
      - name: Lint
        run: just lint

      # 2. mypy --strict on src/agentdx
      - name: Typecheck
        run: just typecheck

      # 3. pytest
      - name: Test
        run: just test

      # 3b. ADR-011 / tripwire 4 / invariant I6 over fixtures/*/golden_findings.json — added
      #     2026-08-13 once tests/golden/test_fixtures_replay.py landed in `just test`'s
      #     default collection, which is the condition this step was previously waiting on.
      - name: Fixture finding evidence
        run: just check-fixture-evidence

      # 4. import-linter — the CONTEXT.md §4 layer contract, especially I3:
      #    agentdx.analysis.* must not import agentdx.runtime.* or agentdx.sdk.*
      - name: Layer contract (import-linter)
        run: just check-imports

      # 5. determinism hygiene — no ambient clock, randomness, uuid or set-order dependence
      - name: Determinism hygiene
        run: just check-determinism

      - name: Entry point responds
        run: uv run agentdx --help

  ledger:
    name: ledger and published numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: extractions/setup-just@v2

      - run: just sync

      # CONTEXT.md §8 and §9 are append-only (AGENTS.md §10, tripwire 13)
      - name: Ledger integrity
        run: just check-ledger

      # Rule E1 / invariant I9: no published statistic without a committed measurement
      - name: Published-number markers
        run: just check-bench

  acceptance:
    name: acceptance gates (PRD §44.1, G1-G10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: just sync
      - run: just sync-frontend
      - run: cd frontend && npx playwright install --with-deps chromium

      # Split 2026-09-07 into a blocking group and an informational group -- the gate-by-gate
      # flip this comment always said was the plan, once each gap's own evidence supported it
      # (see CONTEXT.md §6 for the full per-gate account; this comment summarises rather than
      # duplicates it). Originally added all-continue-on-error by the P18/19 QA-acceptance
      # session, 2026-08-27, when G1/G4/G6/G7/G9 depended on CLI surfaces P17 had deliberately
      # stubbed and G10's own harness didn't exist yet. All of that has since closed: D-82
      # (2026-09-04) built the missing CLI surfaces, and ADR-019 (2026-09-03) closed the D-62
      # scheduler-dispatch deadlock those surfaces depend on, unblocking G9 for the first time
      # in this project's history (`just demo-offline` exits 0 end-to-end).
      #
      # BLOCKING (G1, G2, G3, G4, G5, G6, G7, G9): each is either never-waived (G2, G3 — PRD
      # §44.3) or has a real, dated, evidenced PASS in CONTEXT.md's own gate table -- a real
      # subprocess run, not a self-report. A regression here is a real regression.
      - name: Run gates G1, G2, G3, G4, G5, G6, G7, G9 (blocking)
        run: just acceptance "g1_ or g2_ or g3_ or g4_ or g5_ or g6_ or g7_ or g9_"

      # INFORMATIONAL, still continue-on-error: G8 (Control Tower e2e) is self-reported only
      # -- no independent OP-2 audit has run against P16 yet, so a real defect there should
      # not silently pass as a false green on this job's say-so alone. G10 (Docker cold-start)
      # needs a real Docker daemon this job may or may not have, plus an arm64 target this
      # runner is not (`ubuntu-latest` is x86_64) -- `bench/harness/docker_cold_start.py`
      # itself is real and reports `arch_conformant: false` honestly rather than faking a
      # pass, but that means this step can be green without G10 itself being met. Both stay
      # informational until each has its own real, dated confirmation to promote it.
      - name: Run gates G8, G10 (informational)
        continue-on-error: true
        run: just acceptance "g8_ or g10"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # 6. tsc --noEmit + eslint (AGENTS.md §4: TypeScript strict, no `any`)
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
