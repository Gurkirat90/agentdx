name: CI

# The CI spine. Every job here calls a `just` recipe and nothing else, so what CI runs and
# what a developer runs are the same command by construction. All of it passes on an empty
# tree — the gates exist before the code they gate, which is the only order in which an
# architectural rule survives (CONTEXT.md §5 row 1).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required project-wide; `agentdx doctor` checks it (AGENTS.md §4.1).
  PYTHONHASHSEED: "0"

jobs:
  python:
    name: python (${{ matrix.os }})
    # NFR-12: macOS Apple silicon is the primary target, Linux is the Docker target.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check-ledger diffs §8/§9 against the base; a shallow clone has no base to diff.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync environment
        run: just sync

      # 1. ruff check + ruff format --check
      - name: Lint
        run: just lint

      # 2. mypy --strict on src/agentdx
      - name: Typecheck
        run: just typecheck

      # 3. pytest
      - name: Test
        run: just test

      # 3b. ADR-011 / tripwire 4 / invariant I6 over fixtures/*/golden_findings.json — added
      #     2026-08-13 once tests/golden/test_fixtures_replay.py landed in `just test`'s
      #     default collection, which is the condition this step was previously waiting on.
      - name: Fixture finding evidence
        run: just check-fixture-evidence

      # 4. import-linter — the CONTEXT.md §4 layer contract, especially I3:
      #    agentdx.analysis.* must not import agentdx.runtime.* or agentdx.sdk.*
      - name: Layer contract (import-linter)
        run: just check-imports

      # 5. determinism hygiene — no ambient clock, randomness, uuid or set-order dependence
      - name: Determinism hygiene
        run: just check-determinism

      - name: Entry point responds
        run: uv run agentdx --help

  ledger:
    name: ledger and published numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: extractions/setup-just@v2

      - run: just sync

      # CONTEXT.md §8 and §9 are append-only (AGENTS.md §10, tripwire 13)
      - name: Ledger integrity
        run: just check-ledger

      # Rule E1 / invariant I9: no published statistic without a committed measurement
      - name: Published-number markers
        run: just check-bench

  acceptance:
    name: acceptance gates (PRD §44.1, G1-G10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: just sync
      - run: just sync-frontend
      - run: cd frontend && npx playwright install --with-deps chromium

      # Informational for now, NOT blocking (continue-on-error) -- added by the P18/19
      # QA-acceptance session, 2026-08-27. Real local counts drift as gaps close -- see
      # CONTEXT.md §6's addendum for the current, owner-confirmed per-gate breakdown
      # rather than a snapshot here that will go stale (D-67 already corrected one such
      # snapshot once: an earlier version of this comment miscounted its own figure).
      # G1, G4, G6, G7, G9 depend on CLI surfaces (`--assert`, `scenario run --repeat`,
      # `compare --baseline`, `analyze --scorecard`) that are explicit, declared-scope
      # stubs or missing flags (P17), not bugs in this job. G10 needs
      # bench/harness/docker_cold_start.py, which does not exist yet.
      # Flip continue-on-error to false gate-by-gate as each underlying gap closes --
      # flipping it wholesale before then would just make every unrelated PR red for a
      # reason no single commit can fix, which defeats the point of a gate. This is an
      # explicit, reported decision (see CONTEXT.md §6/§9), not a silent downgrade.
      - name: Run all ten gates
        continue-on-error: true
        run: just acceptance

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # 6. tsc --noEmit + eslint (AGENTS.md §4: TypeScript strict, no `any`)
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
