# AgentDX default project configuration — PRD §8.7.
#
# Precedence (highest wins):
#   CLI flag → environment variable → agentdx.toml → AgentDXConfig argument → default.
#
# Thresholds live here or in src/agentdx/analysis/verdict_rules.toml, never inline
# in code (AGENTS.md §4, CONTEXT.md §11 tripwire 5).

[run]
seed = 42
mode = "replay"                # record | replay | perturb | passthrough — replay is the default (I7)
data_dir = "~/.agentdx"

[store]
# Q-43.2.2 (PRD §27.1, §43.2): at or above this many events a run is exported to Parquet on
# seal and analysed through DuckDB; below it, analysis reads SQLite directly. This is a
# performance decision and never a semantic one — both paths produce identical results, and
# tests/integration/store/test_duckdb_parity.py asserts it. Tune from benchmarks in week 5.
duckdb_threshold_events = 20000

# PRD §20.4: state snapshots every Nth event, so reconstruction is O(N) at any run length.
# A snapshot is an optimisation; the log is the source of truth.
snapshot_interval_events = 500

# Events per store-side transaction (PRD §27.3). The writer owns flush policy; this is the
# ceiling for the bulk paths (bundle import, Parquet round-trips).
append_batch_size = 128

# PRD §27.3: NORMAL during a run — a crash may lose the last batch, and the prefix before it
# stays readable and analysable (NFR-13). Bundle export switches to FULL.
synchronous = "NORMAL"

[privacy]
capture_bodies = false         # NFR-6 / I8: hashes only by default
redact_patterns = ["sk-[A-Za-z0-9]{20,}", "AKIA[0-9A-Z]{16}"]

[scheduler]
strict_determinism = true      # abort on determinism leaks (I1)
step_budget = 100000

# Q-43.2.3 wall-clock calibration defaults (PRD §10.4), used when no calibration profile
# entry exists for a span's (agent_id, kind, name). Integer milliseconds only (ADR-007).
calibration_llm_ms = 800
calibration_tool_ms = 200
calibration_agent_step_ms = 50

[llm]
provider = "groq"
model = "llama-3.1-8b-instant"
base_url = "https://api.groq.com/openai/v1"

[cache]
# PRD §11.9: a separate file from the event store (0600 permissions, applied in code — not
# a tunable, so not listed here).
db_filename = "cache.db"

# Design constraint 2: how many "closest stored key" candidates a replay-mode miss lists,
# and how many recent entries the diagnostic scans to find them. Legibility choices, not
# measured ones (docs/cache.md).
miss_diagnostic_candidates = 5
miss_diagnostic_scan_limit = 200

[analysis]
residual_tolerance = 0.02      # gate G5: Σ(six buckets) + residual = virtual makespan
redundancy = "exact_hash"      # exact_hash only in v1 (43.3.2)

[scenario]
# P08 Design Constraint 2 / P09's "cannot receive an unbounded fault request": PRD §13.6
# gives default guard *values* (below, as guard_default_*) but no hard ceiling a scenario
# author cannot exceed. validate.py's E-SCEN-008 reads guard_ceiling_* here rather than
# hardcoding them (AGENTS.md §4: thresholds live in config, never inline) — CONTEXT.md D-41.
guard_default_max_virtual_duration_ms = 120000
guard_default_max_tokens = 200000
guard_default_max_retries = 20
guard_default_max_wall_duration_s = 300
guard_default_max_events = 500000
guard_default_max_llm_calls = 500

# 10x the PRD default, chosen so a scenario author has real headroom before hitting the
# ceiling while still being unable to declare an unbounded run. Not measured against any
# real workload yet — revisit once P09's fault execution has run traffic to tune against.
guard_ceiling_max_virtual_duration_ms = 1200000
guard_ceiling_max_tokens = 2000000
guard_ceiling_max_retries = 200
guard_ceiling_max_wall_duration_s = 3600
guard_ceiling_max_events = 5000000
guard_ceiling_max_llm_calls = 5000

# PRD §21.6: "run in the sandbox, with a time limit (5 s wall)" — applies to both the
# `type: python` and `type: shell` success_check forms. OP-3 repair (2026-08-16, second
# independent OP-2 finding #6): previously an inline `_SHELL_TIMEOUT_S = 5` literal in
# assertions.py, the same magic-number pattern D-41 already fixed for the guard_* keys above.
success_check_timeout_s = 5
